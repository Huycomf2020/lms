<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b3a"><title>Quản trị | LMS ExamHub</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="fixes.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body">
<header class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">A+</span><span><strong>LMS ExamHub</strong><small>QUẢN TRỊ KHẢO THÍ</small></span></a><div><span id="admin-user">Đang kiểm tra quyền…</span><a class="button secondary" href="index.html">Về trang chính</a></div></header>
<main class="admin-shell"><aside class="admin-nav"><button class="active" data-view="dashboard">▦ Tổng quan</button><button data-view="questions">▤ Ngân hàng câu hỏi</button><button data-view="blueprints">⌗ Ma trận đề</button><button data-view="exams">◫ Kỳ thi</button><button data-view="violations">⚠ Vi phạm</button></aside>
<section class="admin-content"><div id="access-state" class="access-state"><div class="loader"></div><h2>Đang xác minh quyền truy cập</h2><p>Trang quản trị chỉ dành cho giáo viên, phản biện và quản trị viên.</p></div>
<div id="admin-app" hidden><div class="admin-heading"><div><span class="eyebrow">TRUNG TÂM ĐIỀU HÀNH</span><h1 id="view-title">Tổng quan hệ thống</h1></div><button class="button primary" id="new-item">+ Tạo câu hỏi</button></div>
<div class="stat-grid" id="stats"></div><div class="admin-panel"><div class="panel-title"><h2>Dữ liệu gần nhất</h2><span id="table-caption">Ngân hàng câu hỏi</span></div><div class="table-wrap"><table><thead id="data-head"></thead><tbody id="data-body"></tbody></table></div></div></div></section></main>
<dialog id="question-modal" class="wide-dialog"><form class="modal wide" id="question-form"><button type="button" class="modal-close" data-close-modal aria-label="Đóng">×</button><span class="eyebrow">BIÊN SOẠN</span><h2>Tạo câu hỏi nháp</h2><div class="form-grid"><label>Môn<select id="q-subject" required></select></label><label>Mã câu hỏi<input id="q-code" required placeholder="TOAN-2026-001"></label><label class="span-2">Nội dung<textarea id="q-stem" required rows="4"></textarea></label><label class="span-2">Các phương án, mỗi dòng một phương án<textarea id="q-options" required rows="5"></textarea></label><label>Mức độ<select id="q-level"><option value="recognition">Nhận biết</option><option value="comprehension">Thông hiểu</option><option value="application">Vận dụng</option></select></label><label>Chủ đề<input id="q-topic"></label></div><button class="button primary full" type="submit">Lưu bản nháp</button><p class="form-message" id="question-message"></p></form></dialog>
<script src="config.js"></script><script src="admin.js"></script></body></html>
